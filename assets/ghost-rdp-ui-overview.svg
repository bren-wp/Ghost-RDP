<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Ghost RDP interface and runtime overview</title>
  <desc id="desc">A dark Ghost RDP visual showing Saved Computers, Quick Connect, Windows-owned credentials, Microsoft Remote Desktop, and read-only Host diagnostics.</desc>
  <rect width="1200" height="620" rx="30" fill="#0B0F17"/>
  <rect x="34" y="34" width="1132" height="552" rx="24" fill="#121824" stroke="#2C3648" stroke-width="2"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="76" y="98" fill="#F2F5FA" font-size="34" font-weight="700">Ghost RDP</text>
    <text x="76" y="128" fill="#97A3B8" font-size="17">Private Windows remote desktop management with explicit security boundaries</text>

    <rect x="76" y="174" width="288" height="154" rx="18" fill="#161D2A" stroke="#2C3648"/>
    <rect x="456" y="174" width="288" height="154" rx="18" fill="#161D2A" stroke="#2C3648"/>
    <rect x="836" y="174" width="288" height="154" rx="18" fill="#161D2A" stroke="#2C3648"/>

    <rect x="102" y="200" width="42" height="42" rx="11" fill="#202F50"/>
    <path d="M112 209h22v15h-8v4h5v3h-16v-3h5v-4h-8z" fill="#7A98FF"/>
    <text x="158" y="218" fill="#F2F5FA" font-size="20" font-weight="650">Saved computers</text>
    <text x="102" y="260" fill="#97A3B8" font-size="15">Search, favorites and explicit</text>
    <text x="102" y="284" fill="#97A3B8" font-size="15">profile persistence.</text>

    <rect x="482" y="200" width="42" height="42" rx="11" fill="#202F50"/>
    <path d="M505 204l-14 20h9l-2 14 15-22h-9z" fill="#7A98FF"/>
    <text x="538" y="218" fill="#F2F5FA" font-size="20" font-weight="650">Quick Connect</text>
    <text x="482" y="260" fill="#97A3B8" font-size="15">One-off Direct/LAN, private</text>
    <text x="482" y="284" fill="#97A3B8" font-size="15">network or RD Gateway launch.</text>

    <rect x="862" y="200" width="42" height="42" rx="11" fill="#202F50"/>
    <circle cx="883" cy="221" r="11" fill="none" stroke="#7A98FF" stroke-width="3"/>
    <path d="M883 214v8l6 4" fill="none" stroke="#7A98FF" stroke-width="3" stroke-linecap="round"/>
    <text x="918" y="218" fill="#F2F5FA" font-size="20" font-weight="650">Host diagnostics</text>
    <text x="862" y="260" fill="#97A3B8" font-size="15">Read-only Windows readiness</text>
    <text x="862" y="284" fill="#97A3B8" font-size="15">checks. No system mutation.</text>

    <path d="M364 251h72" stroke="#5B7CFA" stroke-width="3" stroke-linecap="round"/>
    <path d="M424 243l12 8-12 8" fill="none" stroke="#5B7CFA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M744 251h72" stroke="#5B7CFA" stroke-width="3" stroke-linecap="round"/>
    <path d="M804 243l12 8-12 8" fill="none" stroke="#5B7CFA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="192" y="386" width="816" height="128" rx="18" fill="#202F50" stroke="#35518A"/>
    <text x="226" y="426" fill="#F2F5FA" font-size="21" font-weight="650">Windows-owned credential boundary</text>
    <text x="226" y="459" fill="#B9C6DD" font-size="16">Ghost RDP validates connection metadata and launches mstsc.exe.</text>
    <text x="226" y="485" fill="#B9C6DD" font-size="16">Passwords never enter saved profiles, settings, temporary .rdp files or process arguments.</text>

    <rect x="925" y="52" width="195" height="42" rx="21" fill="#1C3B31"/>
    <circle cx="950" cy="73" r="7" fill="#4AD79B"/>
    <text x="968" y="79" fill="#BDF7DE" font-size="15" font-weight="600">No telemetry</text>
  </g>
</svg>
